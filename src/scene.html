<main class="room" aria-label="LumaCord login">
      <div class="stage">
        <div class="wordmark" aria-label="LumaCord Studio">LUMACORD <span>STUDIO</span></div>
        <div class="wall-wash light-layer"></div>
        <div class="floor-wash light-layer"></div>
        <div class="lamp-area">
          <svg class="lamp" viewBox="0 0 300 680" fill="none" aria-hidden="true">
            <defs>
              <linearGradient id="metal" x1="143" y1="0" x2="157" y2="0" gradientUnits="userSpaceOnUse"><stop stop-color="#101012"/><stop offset=".19" stop-color="#39383a"/><stop offset=".4" stop-color="#77716a"/><stop offset=".52" stop-color="#2d2b2b"/><stop offset=".8" stop-color="#131317"/><stop offset="1" stop-color="#09090b"/></linearGradient>
              <linearGradient id="brass"><stop stop-color="#493b26"/><stop offset=".3" stop-color="#b7a276"/><stop offset=".49" stop-color="#d7bc83"/><stop offset=".7" stop-color="#716047"/><stop offset="1" stop-color="#2c251c"/></linearGradient>
              <linearGradient id="base" x1="100" y1="620" x2="185" y2="654" gradientUnits="userSpaceOnUse"><stop stop-color="#55504c"/><stop offset=".32" stop-color="#29282b"/><stop offset=".62" stop-color="#151517"/><stop offset="1" stop-color="#08080a"/></linearGradient>
              <linearGradient id="baseTop"><stop stop-color="#18181c"/><stop offset=".36" stop-color="#65615a"/><stop offset=".52" stop-color="#363436"/><stop offset="1" stop-color="#101014"/></linearGradient>
              <linearGradient id="shadeDark"><stop stop-color="#141318"/><stop offset=".15" stop-color="#252329"/><stop offset=".39" stop-color="#2b282f"/><stop offset=".58" stop-color="#25232b"/><stop offset=".83" stop-color="#17161c"/><stop offset="1" stop-color="#101015"/></linearGradient>
              <linearGradient id="shadeWarm"><stop stop-color="#a36e39"/><stop offset=".12" stop-color="#d79f5e"/><stop offset=".34" stop-color="#f6c987"/><stop offset=".53" stop-color="#ffdaa1"/><stop offset=".73" stop-color="#efbc7b"/><stop offset=".92" stop-color="#c58c4e"/><stop offset="1" stop-color="#a57542"/></linearGradient>
              <linearGradient id="shadeVertical" x1="150" y1="59" x2="150" y2="185" gradientUnits="userSpaceOnUse"><stop stop-color="#68370f" stop-opacity=".13"/><stop offset=".55" stop-color="#ffe1af" stop-opacity="0"/><stop offset="1" stop-color="#ffdf9f" stop-opacity=".46"/></linearGradient>
              <radialGradient id="shadeInner"><stop stop-color="#fff4c9"/><stop offset=".5" stop-color="#ffdea0"/><stop offset=".84" stop-color="#efbd79"/><stop offset="1" stop-color="#b58247"/></radialGradient>
              <radialGradient id="bulb"><stop stop-color="#fff7dc"/><stop offset=".65" stop-color="#ffe3a3"/><stop offset="1" stop-color="#cb995b"/></radialGradient>
              <linearGradient id="beam" x1="150" y1="179" x2="150" y2="670" gradientUnits="userSpaceOnUse"><stop stop-color="#f5b665" stop-opacity=".22"/><stop offset=".5" stop-color="#d08a45" stop-opacity=".1"/><stop offset="1" stop-color="#c08446" stop-opacity="0"/></linearGradient>
              <radialGradient id="halo"><stop stop-color="#edaf5e" stop-opacity=".23"/><stop offset=".3" stop-color="#c68a4a" stop-opacity=".13"/><stop offset="1" stop-color="#c68a4a" stop-opacity="0"/></radialGradient>
              <radialGradient id="pool"><stop stop-color="#d78a3c" stop-opacity=".27"/><stop offset=".45" stop-color="#b67439" stop-opacity=".12"/><stop offset="1" stop-color="#ae7438" stop-opacity="0"/></radialGradient>
              <linearGradient id="cordColor" x1="177" y1="190" x2="185" y2="330" gradientUnits="userSpaceOnUse"><stop stop-color="#8c7b60"/><stop offset=".4" stop-color="#d5c09b"/><stop offset="1" stop-color="#bca57a"/></linearGradient>
              <filter id="beamBlur" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="5"/></filter>
              <filter id="softBlur" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="11"/></filter>
              <filter id="shadow" x="-50%" y="-100%" width="200%" height="300%"><feGaussianBlur stdDeviation="6"/></filter>
              <filter id="linen" x="0" y="0" width="100%" height="100%"><feTurbulence type="fractalNoise" baseFrequency=".9 .23" numOctaves="3" seed="14"/><feColorMatrix type="saturate" values="0"/><feComposite in2="SourceGraphic" operator="in"/><feBlend in="SourceGraphic" mode="soft-light"/></filter>
              <clipPath id="shadeClip"><path d="M92 64 Q150 45 208 64 L237 181 Q241 191 229 195 Q150 221 71 195 Q59 191 63 181Z"/></clipPath>
            </defs>
            <g class="lamp-light light-layer">
              <ellipse cx="150" cy="205" rx="420" ry="390" fill="url(#halo)"/>
              <path d="M67 184 L233 184 L862 680 L-550 680Z" fill="url(#beam)" filter="url(#beamBlur)"/>
              <ellipse cx="150" cy="645" rx="340" ry="84" fill="url(#pool)"/>
              <ellipse cx="150" cy="647" rx="94" ry="16" fill="#000" opacity=".6" filter="url(#shadow)"/>
            </g>
            <ellipse cx="153" cy="653" rx="56" ry="9" fill="#000" opacity=".8" filter="url(#shadow)"/>
            <path d="M103 640 Q150 624 197 640 L195 648 Q150 669 105 649Z" fill="url(#base)" stroke="#333034" stroke-width=".6"/>
            <ellipse cx="150" cy="638" rx="46" ry="13" fill="url(#baseTop)" stroke="#4b4643" stroke-width=".65"/>
            <ellipse cx="150" cy="635" rx="31" ry="8" fill="#222124" stroke="#5d5446" stroke-opacity=".5"/>
            <path d="M140 631 L143 620 L157 620 L160 631 Q150 636 140 631" fill="url(#brass)"/>
            <rect x="143" y="228" width="14" height="402" rx="4" fill="url(#metal)"/>
            <path d="M146 239 V619" stroke="#c4a36e" stroke-opacity=".17"/>
            <rect x="140.5" y="427" width="19" height="10" rx="2" fill="url(#brass)"/>
            <path d="M141 430 H159 M141 434 H159" stroke="#2c2116" stroke-opacity=".5" stroke-width=".7"/>
            <rect x="141" y="225" width="18" height="11" rx="3" fill="url(#brass)"/>
            <path d="M129 188 Q126 216 141 225 Q150 232 159 225 Q174 216 171 188Z" fill="#33302d"/>
            <path class="bulb-light light-layer" d="M129 188 Q126 216 141 225 Q150 232 159 225 Q174 216 171 188Z" fill="url(#bulb)"/>
            <ellipse class="bulb-glow light-layer" cx="150" cy="201" rx="30" ry="29" fill="#ffcf80" opacity=".45" filter="url(#softBlur)"/>
            <path d="M92 64 Q150 45 208 64 L237 181 Q241 191 229 195 Q150 221 71 195 Q59 191 63 181Z" fill="url(#shadeDark)" stroke="#373239" stroke-width=".9"/>
            <g class="shade-lit light-layer">
              <path d="M92 64 Q150 45 208 64 L237 181 Q241 191 229 195 Q150 221 71 195 Q59 191 63 181Z" fill="url(#shadeWarm)"/>
              <path d="M92 64 Q150 45 208 64 L237 181 Q241 191 229 195 Q150 221 71 195 Q59 191 63 181Z" fill="url(#shadeVertical)"/>
            </g>
            <g clip-path="url(#shadeClip)" opacity=".13"><rect x="60" y="47" width="180" height="165" fill="#8a8072" filter="url(#linen)"/></g>
            <path d="M92 64 Q150 45 208 64" stroke="#85735d" stroke-opacity=".5" stroke-width="1.5"/>
            <path d="M92 65 L63 185 M208 65 L237 185" stroke="#b0a08a" stroke-opacity=".13"/>
            <ellipse cx="150" cy="187" rx="88" ry="18" fill="#101015" stroke="#353137" stroke-width="1.5"/>
            <ellipse class="shade-lit light-layer" cx="150" cy="187" rx="88" ry="18" fill="url(#shadeInner)" stroke="#f8dba5" stroke-width="1.5"/>
            <path class="shade-lit light-layer" d="M65 190 Q150 219 235 190" stroke="#ffe7b7" stroke-width="2"/>
            <path class="cord-shadow" d="M184 190 Q185 251 184 317" stroke="#000" stroke-opacity=".25" stroke-width="3"/>
            <path class="cord-path" d="M184 190 Q184 251 184 317" stroke="url(#cordColor)" stroke-width="1.8" stroke-linecap="round"/>
            <g class="cord-tip" transform="translate(184 317)"><path d="M-2 -7 L2 -7 L3 1 L5 6 Q5 12 0 14 Q-5 12 -5 6 L-3 1Z" fill="url(#brass)"/><ellipse cy="6" rx="2.4" ry="4.5" fill="#c7ad79" opacity=".35"/></g>
          </svg>
          <button class="cord-hit" aria-label="Pull cord to turn the lamp on" aria-pressed="false"><span class="sr-only">Pull the lamp cord</span></button>
          <div class="pull-hint"><span class="hint-line"></span><span class="hint-text">PULL TO ILLUMINATE</span></div>
        </div>
        <div class="dust light-layer" aria-hidden="true"></div>
        <section class="login-panel" aria-label="LumaCord access" inert aria-hidden="true">
          <div class="panel-edge"></div>
          <header class="reveal" style="--order:0">
            <p class="eyebrow">STUDIO ACCESS</p>
            <h1>Welcome back.<br><em>Pull up a chair.</em></h1>
          </header>
          <form novalidate>
            <div class="field reveal" style="--order:1">
              <label for="email">EMAIL</label>
              <div class="input-wrap"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="3"/><path d="m4 7 8 6 8-6"/></svg><input id="email" name="email" required type="email" placeholder="you@example.com" autocomplete="username" spellcheck="false" /></div>
            </div>
            <div class="field reveal" style="--order:2">
              <label for="password">PASSWORD</label>
              <div class="input-wrap"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="10" width="14" height="11" rx="3"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/><path d="M12 14v3"/></svg><input id="password" name="password" required type="password" placeholder="••••••••" autocomplete="current-password" /><button class="show-password" type="button" aria-label="Show password" aria-pressed="false">SHOW</button></div>
            </div>
            <div class="form-options reveal" style="--order:3"><label class="remember"><input name="remember" type="checkbox" checked /><span>Keep me signed in</span></label><button class="text-button" type="button">Forgot password?</button></div>
            <button class="sign-in reveal" style="--order:4" type="submit"><b class="submit-label">Sign in</b> <span aria-hidden="true">↗</span></button>
            <div class="divider reveal" style="--order:5"><span></span>OR<span></span></div>
            <div class="socials reveal" style="--order:6">
              <button type="button"><svg viewBox="0 0 24 24" class="provider-icon" aria-hidden="true"><circle cx="12" cy="8" r="3"/><path d="M5 21v-2a7 7 0 0 1 14 0v2Z"/></svg>Apple</button>
              <button type="button"><svg viewBox="0 0 24 24" class="provider-icon" aria-hidden="true"><path d="m12 3-8 3v6c0 4 3 7 8 9 5-2 8-5 8-9V6Z"/><path d="m8 12 3 3 5-6"/></svg>Google</button>
            </div>
            <p class="form-feedback" role="status" aria-live="polite" hidden></p>
          </form>
          <footer class="panel-footer reveal" style="--order:7"><p>No account? <button class="text-button" type="button">Request one <span aria-hidden="true">↗</span></button></p><p class="small-print">Come back to something worth creating.</p></footer>
        </section>
        <div class="scene-footer"><span>A LITTLE LIGHT. A LITTLE POSSIBILITY.</span><span class="light-status"><i></i><span>LIGHTS OUT</span></span></div>
      </div>
      <div class="grain" aria-hidden="true"></div>
      <p class="sr-only" role="status" id="lamp-status">Lamp off. Pull the cord or press Enter to illuminate the room.</p>
    </main>
